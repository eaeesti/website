packages:
  - backend
  - frontend

# Security patches for dependencies Strapi pins to vulnerable versions.
overrides:
  axios: ^1.20.0
  dompurify: ^3.4.16
  markdown-it: ^14.3.1
  nodemailer: ^10.0.13
  sharp: ^0.35.5

# Which dependencies may run install scripts. pnpm blocks all others.
allowBuilds:
  "@swc/core": true
  esbuild: true
  core-js-pure: false
